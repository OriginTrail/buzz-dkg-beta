name: Buzz DKG Beta desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta semver without the leading v
        required: true
        default: 0.5.7-dkg-beta.4
        type: string
      publish:
        description: Publish all successful packages as a GitHub prerelease
        required: true
        default: false
        type: boolean
      source_ref:
        description: OriginTrail/buzz branch containing the reviewed beta stack
        required: true
        default: perf/dkg-memory-refresh-control
        type: string
      source_sha:
        description: Immutable full SHA expected at source_ref
        required: true
        default: 5a5238d1e841b9faf9e49f54d65fc1e85b7238e1
        type: string

concurrency:
  group: buzz-dkg-beta-desktop-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUZZ_UPDATER_ENDPOINT: https://github.com/OriginTrail/buzz-dkg-beta/releases/download/buzz-dkg-beta-latest/latest.json

jobs:
  validate:
    name: Validate beta build contract
    if: github.repository == 'OriginTrail/buzz-dkg-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Materialize reviewed OriginTrail/buzz source
        run: scripts/materialize-canonical-buzz-source.sh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install dependencies
        run: just desktop-install-ci

      - name: Validate requested version and build contract
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dkg-beta\.[0-9]+$ ]] || {
            echo "::error::Version must match X.Y.Z-dkg-beta.N"
            exit 1
          }
          cd desktop
          node scripts/set-dkg-beta-version.mjs "$VERSION"
          pnpm check:dkg-beta

      - name: Validate updater signing configuration
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [[ -n "$UPDATER_PUBLIC_KEY" ]] || { echo "::error::BUZZ_UPDATER_PUBLIC_KEY is not configured"; exit 1; }
          [[ -n "$UPDATER_PRIVATE_KEY" ]] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Materialize reviewed OriginTrail/buzz source
        run: scripts/materialize-canonical-buzz-source.sh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set beta version
        run: cd desktop && node scripts/set-dkg-beta-version.mjs "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Generate updater-enabled beta config
        run: cd desktop && node scripts/build-dkg-beta-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}

      - name: Build unsigned keychain-free packages
        run: desktop/scripts/build-dkg-beta-macos.sh "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          BUZZ_DKG_BETA_TAURI_CONFIG: src-tauri/tauri.dkg-beta.release.conf.json
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Validate macOS packages
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/src-tauri/target/${TARGET}/release/bundle"
          ZIP=$(find "$BUNDLE_ROOT/zip" -name '*.zip' -type f | head -1)
          [[ -n "$ZIP" ]] || { echo "::error::No macOS ZIP found"; exit 1; }
          ARCHIVE=$(find "$BUNDLE_ROOT/macos" -name '*.app.tar.gz' -type f | head -1)
          [[ -n "$ARCHIVE" && -f "${ARCHIVE}.sig" ]] || {
            echo "::error::No signed macOS updater archive found"
            exit 1
          }
          DMG=$(find "$BUNDLE_ROOT/dmg" -name '*.dmg' -type f | head -1 || true)
          if [[ -z "$DMG" ]]; then
            echo "::warning::No DMG was produced; publishing the ZIP fallback"
          fi
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-dkg-beta-macos-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/zip/*.zip
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    timeout-minutes: 90
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      TARGET: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl desktop-file-utils file git \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config squashfs-tools wget xdg-utils

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Materialize reviewed OriginTrail/buzz source
        run: scripts/materialize-canonical-buzz-source.sh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Add Rust target
        run: rustup target add "$TARGET"

      - name: Install pinned AppImage tools
        run: |
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: just desktop-install-ci

      - name: Set beta version
        run: cd desktop && node scripts/set-dkg-beta-version.mjs "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Generate updater-enabled beta config
        run: cd desktop && node scripts/build-dkg-beta-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}

      - name: Build Linux packages
        run: desktop/scripts/build-dkg-beta-linux.sh "$TARGET"
        env:
          BUZZ_DKG_BETA_TAURI_CONFIG: src-tauri/tauri.dkg-beta.release.conf.json
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix AppImage portability
        run: |
          BUNDLE_ROOT="desktop/src-tauri/target/${TARGET}/release/bundle"
          mapfile -t APPIMAGES < <(find "$BUNDLE_ROOT/appimage" -name '*.AppImage' -type f)
          [[ ${#APPIMAGES[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}"
            exit 1
          }
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Validate Linux packages
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/src-tauri/target/${TARGET}/release/bundle"
          DEB=$(find "$BUNDLE_ROOT/deb" -name '*.deb' -type f | head -1)
          APPIMAGE=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage' -type f | head -1)
          [[ -n "$DEB" ]] || { echo "::error::No Debian package found"; exit 1; }
          [[ -n "$APPIMAGE" ]] || { echo "::error::No AppImage found"; exit 1; }
          [[ -f "${APPIMAGE}.sig" ]] || { echo "::error::No AppImage updater signature found"; exit 1; }
          ASSET_NAME=$(node desktop/scripts/dkg-beta-assets.mjs "$VERSION" --asset linux-x86_64)
          RENAMED="$BUNDLE_ROOT/appimage/$ASSET_NAME"
          mv "$APPIMAGE" "$RENAMED"
          mv "${APPIMAGE}.sig" "${RENAMED}.sig"
        env:
          VERSION: ${{ inputs.version }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-dkg-beta-linux-x86_64
          path: |
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Materialize reviewed OriginTrail/buzz source
        shell: bash
        run: scripts/materialize-canonical-buzz-source.sh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Set beta version
        shell: bash
        run: cd desktop && node scripts/set-dkg-beta-version.mjs "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Generate updater-enabled beta config
        shell: bash
        run: cd desktop && node scripts/build-dkg-beta-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}

      - name: Build Windows installer
        shell: bash
        run: desktop/scripts/build-dkg-beta-windows.sh "$TARGET"
        env:
          BUZZ_DKG_BETA_TAURI_CONFIG: src-tauri/tauri.dkg-beta.release.conf.json
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Validate Windows installer
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_ROOT/nsis" -name '*.exe' -type f | head -1)
          [[ -n "$EXE" ]] || { echo "::error::No NSIS installer found"; exit 1; }
          [[ -f "${EXE}.sig" ]] || { echo "::error::No NSIS updater signature found"; exit 1; }
          ASSET_NAME=$(node desktop/scripts/dkg-beta-assets.mjs "$VERSION" --asset windows-x86_64)
          RENAMED="$BUNDLE_ROOT/nsis/$ASSET_NAME"
          mv "$EXE" "$RENAMED"
          mv "${EXE}.sig" "${RENAMED}.sig"
        env:
          VERSION: ${{ inputs.version }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-dkg-beta-windows-x86_64
          path: |
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish cross-platform prerelease
    needs: [macos, linux, windows]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buzz-dkg-beta-*
          path: staged-by-platform

      - name: Flatten packages
        run: |
          set -euo pipefail
          mkdir dist
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            [[ ! -e "dist/$name" ]] || {
              echo "::error::Package basename collision: $name"
              exit 1
            }
            cp "$file" "dist/$name"
          done < <(find staged-by-platform -type f -print0)
          [[ $(find dist -type f | wc -l) -ge 5 ]] || {
            echo "::error::Expected packages for all desktop platforms"
            exit 1
          }

      - name: Generate signed updater candidate
        run: |
          set -euo pipefail
          ASSET_MODEL=$(node desktop/scripts/dkg-beta-assets.mjs "$VERSION")
          MAC_ARM="dist/$(jq -r '.platforms["darwin-aarch64"].updaterArchive' <<<"$ASSET_MODEL")"
          MAC_X64="dist/$(jq -r '.platforms["darwin-x86_64"].updaterArchive' <<<"$ASSET_MODEL")"
          LINUX="dist/$(jq -r '.platforms["linux-x86_64"].updaterArchive' <<<"$ASSET_MODEL")"
          WINDOWS="dist/$(jq -r '.platforms["windows-x86_64"].updaterArchive' <<<"$ASSET_MODEL")"
          for archive in "$MAC_ARM" "$MAC_X64" "$LINUX" "$WINDOWS"; do
            [[ -f "$archive" ]] || { echo "::error::Missing updater archive: $archive"; exit 1; }
            [[ -f "${archive}.sig" ]] || { echo "::error::Missing updater signature: ${archive}.sig"; exit 1; }
          done

          BASE="https://github.com/OriginTrail/buzz-dkg-beta/releases/download/v${VERSION}"
          UPDATER_NOTES="Buzz DKG Beta ${VERSION}" \
            bash desktop/scripts/generate-oss-latest-json.sh "$VERSION" \
              "darwin-aarch64:${MAC_ARM}.sig:${BASE}/$(basename "$MAC_ARM")" \
              "darwin-x86_64:${MAC_X64}.sig:${BASE}/$(basename "$MAC_X64")" \
              "linux-x86_64:${LINUX}.sig:${BASE}/$(basename "$LINUX")" \
              "windows-x86_64:${WINDOWS}.sig:${BASE}/$(basename "$WINDOWS")" \
              > dist/updater-manifest.json

          jq -e --arg version "$VERSION" '
            .version == $version and
            (.platforms | keys == ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"])
          ' dist/updater-manifest.json >/dev/null

      - name: Checksum complete release
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create or reuse matching draft
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            TARGET_COMMIT=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)
            [[ "$IS_DRAFT" == true ]] || {
              echo "::error::Release $TAG is already published; versions are immutable"
              exit 1
            }
            [[ "$TARGET_COMMIT" == "$GITHUB_SHA" ]] || {
              echo "::error::Draft $TAG targets $TARGET_COMMIT, not $GITHUB_SHA"
              exit 1
            }
          else
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "Buzz DKG Beta ${VERSION}" \
              --notes "Cross-platform beta for authenticated OriginTrail DKG community memory. Built from OriginTrail/buzz commit ${SOURCE_SHA}. Update bundles carry mandatory Tauri signatures; the macOS and Windows packages remain unsigned by Apple and Microsoft."
          fi

      - name: Upload complete package set
        run: |
          mapfile -t files < <(find dist -type f -print)
          gh release upload "v${VERSION}" "${files[@]}" --clobber

      - name: Publish release
        run: gh release edit "v${VERSION}" --draft=false --prerelease --latest=false
